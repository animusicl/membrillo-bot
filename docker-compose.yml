version: '3.8'

services:
  hermes:
    image: ghcr.io/nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    ports:
      - "9119:9119"
    environment:
      - HERMES_PROVIDER=opencode-free
      - HERMES_MODEL=${HERMES_MODEL:-nemotron-3-ultra-free}
    volumes:
      - hermes-data:/home/hermes/.hermes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9119/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - HERMES_MODEL=${HERMES_MODEL:-nemotron-3-ultra-free}
      - MAX_HISTORY=${MAX_HISTORY:-500}
      - HERMES_URL=http://hermes:9119
    volumes:
      - session-data:/app/session.json

volumes:
  hermes-data:
  session-data: