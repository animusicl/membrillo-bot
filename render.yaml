services:
  - type: web
    name: hermes-discord-bot
    runtime: docker
    repo: https://github.com/animusicl/membrillo-bot
    branch: master
    dockerfilePath: ./Dockerfile.bot
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: HERMES_MODEL
        value: nemotron-3-ultra-free
      - key: MAX_HISTORY
        value: "500"
      - key: HERMES_URL
        value: https://TU_URL_TAILSCALE.tailscale.net  # CAMBIA ESTO