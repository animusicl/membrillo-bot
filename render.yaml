services:
  - type: web
    name: discord-openrouter-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HERMES_MODEL
        value: openrouter/free
      - key: MAX_HISTORY
        value: "500"